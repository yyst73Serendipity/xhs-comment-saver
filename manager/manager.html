<!--
  manager.html - 评论收藏管理页面
  左侧分类栏 + 右侧评论列表，支持搜索、筛选、管理收藏
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书评论收藏</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body class="app-body">
  <div class="app">
    <!-- 顶部栏 -->
    <header class="header">
      <h1 class="header-title">宝藏仓库</h1>
      <span class="header-count" id="total-count">空空如也</span>
    </header>

    <div class="main">
      <!-- 左侧分类栏 -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>分类</span>
          <button class="btn-add-cat" id="btn-add-cat" title="新建分类">+</button>
        </div>
        <ul class="category-list" id="category-list">
          <!-- 动态渲染 -->
        </ul>
        <!-- 新建分类输入框（默认隐藏） -->
        <div class="new-cat-input hidden" id="new-cat-input">
          <input type="text" placeholder="输入分类名" maxlength="20" id="input-cat-name">
          <button class="btn-confirm" id="btn-confirm-cat">确定</button>
          <button class="btn-cancel" id="btn-cancel-cat">取消</button>
        </div>
      </aside>

      <!-- 分类删除确认弹窗（默认隐藏） -->
      <div class="modal-overlay hidden" id="delete-modal">
        <div class="modal-dialog">
          <div class="modal-title">分类删除提醒</div>
          <div class="modal-body" id="delete-modal-body">
            确定删除分类「<span class="cat-name-highlight"></span>」吗？该分类下的评论将移至「<span class="cat-fallback-highlight"></span>」。
          </div>
          <div class="modal-actions">
            <button class="btn-modal-cancel" id="btn-modal-cancel">取消</button>
            <button class="btn-modal-confirm" id="btn-modal-confirm">确定</button>
          </div>
        </div>
      </div>

      <!-- 评论删除确认弹窗（默认隐藏） -->
      <div class="modal-overlay hidden" id="comment-delete-modal">
        <div class="modal-dialog">
          <div class="modal-title">评论删除提醒</div>
          <div class="modal-body">
            确定删除该条评论吗？删除后无法恢复哦。
          </div>
          <div class="modal-actions">
            <button class="btn-modal-cancel" id="btn-comment-modal-cancel">取消</button>
            <button class="btn-modal-confirm" id="btn-comment-modal-confirm">确定</button>
          </div>
        </div>
      </div>

      <!-- 清空数据确认弹窗（默认隐藏） -->
      <div class="modal-overlay hidden" id="clear-modal">
        <div class="modal-dialog">
          <div class="modal-title">数据清空提醒</div>
          <div class="modal-body">
            确定清空所有收藏数据和分类吗？此操作不可恢复哦，建议先导出备份。
          </div>
          <div class="modal-actions">
            <button class="btn-modal-cancel" id="btn-clear-modal-cancel">取消</button>
            <button class="btn-modal-confirm" id="btn-clear-modal-confirm">确定</button>
          </div>
        </div>
      </div>

      <!-- 导入/导出结果弹窗（默认隐藏） -->
      <div class="modal-overlay hidden" id="result-modal">
        <div class="modal-dialog">
          <div class="modal-title" id="result-modal-title"></div>
          <div class="modal-body" id="result-modal-body"></div>
          <div class="modal-actions">
            <button class="btn-modal-confirm" id="btn-result-modal-ok">确定</button>
          </div>
        </div>
      </div>

      <!-- 右侧评论列表 -->
      <section class="content">
        <!-- 搜索和操作栏 -->
        <div class="toolbar">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="search-input" placeholder="搜索收藏的评论...">
          </div>
          <button class="btn-export" id="btn-export" title="导出为 JSON 文件">导出</button>
          <button class="btn-import" id="btn-import" title="从 JSON 文件导入">导入</button>
          <button class="btn-clear" id="btn-clear" title="清空所有收藏数据">清空</button>
          <input type="file" class="import-file" id="import-file" accept=".json" hidden>
        </div>

        <!-- 评论列表 -->
        <div class="comment-list" id="comment-list">
          <!-- 动态渲染 -->
        </div>

        <!-- 空状态 -->
        <div class="empty-state hidden" id="empty-state">
          <div class="empty-icon">&#128203;</div>
          <p>还没有收藏的评论</p>
          <p class="empty-hint">去小红书浏览帖子，点击评论旁的收藏按钮吧</p>
        </div>
      </section>

      <!-- 右侧面板：AI 总结 + 思维导图 -->
      <aside class="right-panel" id="right-panel">
        <!-- AI 总结区 -->
        <div class="panel-section panel-summary" id="panel-summary">
          <div class="panel-section-header">
            <span class="panel-section-title">AI 总结</span>
            <div class="panel-summary-actions">
              <button class="panel-action-btn" id="btn-summary-edit" title="编辑">✎</button>
              <button class="panel-action-btn" id="btn-summary-ai" title="AI 生成">🤖</button>
              <button class="panel-action-btn" id="btn-summary-export" title="导出 MD">📥</button>
            </div>
          </div>
          <div class="panel-section-body" id="summary-body">
            <!-- 空状态 -->
            <div class="summary-empty" id="summary-empty">
              <p>还没有总结笔记</p>
              <p class="summary-empty-hint">点击 ✎ 手动编写<br>或点击 🤖 AI 自动生成</p>
            </div>
            <!-- 预览态 -->
            <div class="summary-preview hidden" id="summary-preview"></div>
            <!-- 编辑态（实时自动保存） -->
            <textarea class="summary-editor hidden" id="summary-editor" placeholder="用 Markdown 写总结..."></textarea>
            <!-- 生成中 -->
            <div class="summary-loading hidden" id="summary-loading">
              <div class="loading-spinner"></div>
              <p>AI 正在分析评论...</p>
            </div>
            <!-- 全部分类占位 -->
            <div class="summary-placeholder hidden" id="summary-placeholder">
              <p>请选择具体分类</p>
              <p class="summary-empty-hint">选择左侧分类后可使用 AI 总结和思维导图</p>
            </div>
          </div>
          <!-- 自动保存状态 -->
          <div class="summary-autosave hidden" id="summary-autosave"></div>
          <!-- 元信息 -->
          <div class="summary-meta hidden" id="summary-meta"></div>
        </div>

        <!-- 成长视图区（关系图谱 / 河流图 / 网格图 / 仪表盘） -->
        <div class="panel-section panel-graph" id="panel-graph">
          <div class="panel-section-header">
            <span class="panel-section-title" id="graph-view-title">关系图谱</span>
            <div class="panel-graph-actions">
              <div class="view-switch-group">
                <button class="view-switch-btn" data-view="river" title="河流图">🌊</button>
                <button class="view-switch-btn" data-view="grid" title="网格图">📊</button>
                <button class="view-switch-btn" data-view="dashboard" title="仪表盘">📈</button>
                <button class="view-switch-btn active" data-view="graph" title="关系图">🔗</button>
              </div>
            </div>
          </div>
          <div class="panel-section-body" id="graph-body">
            <!-- 河流图 -->
            <canvas id="river-canvas" class="view-canvas hidden"></canvas>
            <!-- 河流图图例 -->
            <div id="river-legend" class="river-legend hidden"></div>
            <!-- 网格图 -->
            <canvas id="grid-canvas" class="view-canvas hidden"></canvas>
            <!-- 网格图 tooltip -->
            <div class="grid-tooltip hidden" id="grid-tooltip"></div>
            <!-- 仪表盘 -->
            <div id="dashboard-container" class="hidden"></div>
            <!-- 关系图谱 -->
            <canvas id="graph-canvas" class="view-canvas"></canvas>
            <!-- 节点 tooltip -->
            <div class="graph-tooltip hidden" id="graph-tooltip"></div>
            <!-- 节点详情浮层 -->
            <div class="graph-detail-popup hidden" id="graph-detail-popup">
              <div class="graph-detail-close" id="graph-detail-close">✕</div>
              <div class="graph-detail-author" id="graph-detail-author"></div>
              <div class="graph-detail-text" id="graph-detail-text"></div>
              <div class="graph-detail-post" id="graph-detail-post"></div>
            </div>
            <!-- 关系图谱空状态 -->
            <div class="graph-empty hidden" id="graph-empty">
              <span>节点太少（需要 ≥ 3 条评论）</span>
            </div>
            <!-- 关系图谱图例 -->
            <div class="graph-legend" id="graph-legend">
              <span><span class="graph-legend-line" style="background:rgba(232,56,79,0.5);"></span> 关联评论组</span>
              <span><span class="graph-legend-line" style="border-top:1px dashed rgba(180,160,140,0.4);"></span> 同一帖子</span>
              <span><span class="graph-legend-line" style="border-top:1px dotted rgba(180,160,140,0.25);"></span> 同一作者</span>
            </div>
            <!-- 关系图谱全部分类占位 -->
            <div class="graph-placeholder hidden" id="graph-placeholder">
              <span>请选择具体分类</span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="apiconfig.js"></script>
  <script src="manager.js"></script>
</body>
</html>
